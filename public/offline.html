<!DOCTYPE html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Offline - Daily Planner</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #09090b;
                color: #fafafa;
            }
            .container {
                text-align: center;
                padding: 2rem;
                max-width: 24rem;
            }
            .icon {
                width: 64px;
                height: 64px;
                margin: 0 auto 1.5rem;
                background: #6366f1;
                border-radius: 1rem;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .icon svg { width: 32px; height: 32px; fill: white; }
            h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
            p { color: #a1a1aa; font-size: 0.875rem; margin: 0 0 1.5rem; line-height: 1.5; }
            button {
                background: #6366f1;
                color: white;
                border: none;
                border-radius: 0.75rem;
                padding: 0.75rem 1.5rem;
                font-size: 0.875rem;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.15s;
            }
            button:active { transform: scale(0.95); }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">
                <svg viewBox="0 0 40 42">
                    <rect x="7" y="6" width="26" height="32" rx="5" fill="white" opacity="0.15"/>
                    <rect x="7" y="6" width="26" height="32" rx="5" stroke="white" stroke-width="2.5" fill="none"/>
                    <rect x="14" y="3" width="12" height="6" rx="3" fill="white"/>
                    <path d="M13 19l4 4l9-10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
            <h1>You're Offline</h1>
            <p>Daily Planner requires an internet connection to work. Please check your connection and try again.</p>
            <button onclick="location.href='/dashboard'">Try Again</button>
        </div>
    </body>
</html>
